name: Obsidian to Jekyll (Intaglio)

on:
  push:
    branches:
      - master  # Lasciamo master visto che il tuo repository usa questo branch

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  convert-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv (Python tool manager)
        uses: astral-sh/setup-uv@v5

      - name: Run Intaglio Conversion
        run: |
          uv tool install git+https://github.com/kckhchen/intaglio@v1 ./_notes

      - name: Commit and Push converted posts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts/
          git diff-index --quiet HEAD || git commit -m "Auto-convert Obsidian notes to Jekyll posts"
          git push

      # Questo pezzo dice a GitHub Pages di aggiornare visivamente il sito web subito dopo
      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
