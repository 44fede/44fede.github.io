nname: Obsidian to Jekyll (Intaglio)

on:
  push:
    branches:
      - master  # Cambia in main se il tuo branch principale si chiama main

permissions:
  contents: write

jobs:
  convert-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv (Python tool manager)
        uses: astral-sh/setup-uv@v5

      - name: Run Intaglio Conversion
        env:
          VAULT_DIR: ./_notes
          JEKYLL_DIR: .
        run: |
          uv tool install git+https://github.com/kckhchen/intaglio@v1
          intaglio update

      - name: Commit and Push converted posts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts/
          git commit -a -m "Auto-update and convert Obsidian notes to Jekyll posts" || echo "No changes to commit"
          git push origin master
